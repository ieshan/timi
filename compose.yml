services:
  test:
    image: golang:1.26.4-trixie
    working_dir: /app
    volumes:
      - "./:/app"
    networks:
      - timi-network
    depends_on:
      - mongo
      - postgres
      - mariadb
    command:
      - "sh"
      - "-c"
      - "rm -f go.work go.work.sum && go work init . ./integration-tests ./mongodb && go mod download && go test -v ./..."
    stop_signal: SIGINT
  postgres:
    image: postgres:18.4-alpine3.24
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    networks:
      - timi-network
  mariadb:
    image: mariadb:12.3.2-ubi1o
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
    networks:
      - timi-network
  mongo:
    image: mongo:8.3.4-noble
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - timi-network
networks:
  timi-network:
    driver: bridge
